[project]
name = "gda"
version = "0.24.0"
description = "Godot automation for AI agents to build and verify projects through a CLI, Agent Skill, or MCP server, with structured results, headless operations, and live runtime control."
readme = "README.md"
authors = [
    { name = "haihong.qin", email = "haihongqin@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["godot", "godot-engine", "godot-ai", "godot-mcp", "cli", "mcp", "mcp-server", "model-context-protocol", "ai-agent", "coding-agent", "agent", "agent-skill", "skill", "gdscript", "structured-output", "headless", "runtime-verification", "game-development", "automation", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "typer>=0.26.7",
]

[project.urls]
Homepage = "https://aigengame.xyz/"
Repository = "https://github.com/aigengame/godot-agent"
Issues = "https://github.com/aigengame/godot-agent/issues"
Changelog = "https://github.com/aigengame/godot-agent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The MCP adapter (gda-mcp) ships inside this one distribution, gated behind an
# optional extra so a plain `gda` install stays lean — only `gda[mcp]` pulls the
# MCP SDK (ADR-0013). Pinned to the v2 low-level Server API (constructor-callback
# handlers, snake_case Tool/CallToolResult fields, 2026-07-28 dual-era protocol)
# that gda-mcp targets (ADR-0039); <3 fences off the next major's API break.
mcp = [
    "mcp>=2,<3",
]

[project.scripts]
gda = "gda.cli:entrypoint"
# Declared in every install (ADR-0013); without the `[mcp]` extra it errors on a
# missing `mcp` import with an actionable "install gda[mcp]" message.
gda-mcp = "gda.mcp:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.0.3",
    # Both pytest tiers run in parallel by default (`addopts` below, #818, #1173):
    # the suite is wall-clock bound by process waits and engine boots, not CPU.
    # The `xdist_group("windowed")` mark keeps the tests that open a real window
    # on one worker, so two windowed sessions never share the host display at once.
    "pytest-xdist>=3.8.0",
    # The MCP SDK is also a dev dependency (not just the `[mcp]` extra) so
    # `uv run pytest` has it for the gda-mcp fast/e2e tiers (ADR-0013).
    "mcp>=2,<3",
    # Pillow opens the PNG captures that the screen and rendered-UI test support
    # modules (tests/screen_support.py, tests/rendered_ui_support.py) read back.
    # A dev dependency: only the tests decode images, the package never does.
    "pillow>=11.0",
    # Lint + format gate (CI `lint` job). Pinned so `ruff format` output stays
    # stable across the team and CI; the exact version is locked in uv.lock.
    "ruff>=0.15.19,<0.16",
    # Type-check gate (CI `type-check` job, ADR-0030). Pinned so a pyright upgrade
    # — which can add new checks — is a deliberate uv.lock bump, not a surprise PR
    # failure; the exact version is locked in uv.lock.
    "pyright>=1.1.411,<1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `scripts/` holds repo-automation modules the workflows call directly (they are
# stdlib-only so any environment can run them). They are not part of the shipped
# `gda` distribution, so they live outside `src/`; putting the directory on the
# test path is what lets `tests/` import and cover them.
pythonpath = ["scripts"]
# The one parallel policy for local and CI runs (#1173). `-n auto` resolves to
# the project default in tests/conftest.py: 4 workers, capped at the CPU count,
# or the value of `PYTEST_XDIST_AUTO_NUM_WORKERS`; `-n 0` on the command line
# runs serially. `--dist loadgroup` keeps the `xdist_group`-marked tests on one
# worker. `-rs` lists every skip reason, so a silently-skipped e2e is visible.
addopts = "-n auto --dist loadgroup -rs"
markers = [
    "e2e: tests that spawn a real Godot process (requires a 4.4+ engine)",
    "rendered: e2e tests of rendered capture and windowed input, which CI runs on an Xvfb display",
]

[tool.ruff]
target-version = "py313"  # ruff's default line-length (88) already matches the codebase

[tool.ruff.lint]
# Ruff's default high-signal set, made explicit and pinned against version drift.
# Deliberately NOT full "E": E1/E2/E3/E5 are whitespace/line-length rules the
# formatter owns — enabling them would conflict with `ruff format`.
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
# Type-check gate (ADR-0030). Covers the shipped library (src/) and the tests/;
# `basic` mode is the starting point — a strictness ratchet and a possible `ty`
# migration are tracked separately.
include = ["src", "tests", "scripts"]
# `scripts/` is not importable as a package from the repo root, so pyright needs
# the same path the pytest `pythonpath` gives the suite in order to resolve
# `import release_tags` from a test module.
extraPaths = ["scripts"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
