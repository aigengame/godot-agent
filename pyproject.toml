[project]
name = "gda"
version = "0.1.16"
description = "An agent-facing Godot CLI with structured output"
authors = [
    { name = "haihong.qin", email = "haihongqin@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "typer>=0.26.7",
]

[project.scripts]
gda = "gda.cli:app"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: tests that spawn a real Godot process (requires a 4.4+ engine)",
]
