name: Set up Python environment
description: >-
  Install uv pinned to the project's Python and sync dev dependencies. Single
  source of truth for the Python toolchain shared by CI and Release.

inputs:
  python-version:
    description: Python version for uv to provide.
    required: false
    default: "3.13"
  save-cache:
    description: Whether setup-uv should save its dependency cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        save-cache: ${{ inputs.save-cache }}
        cache-dependency-glob: |
          pyproject.toml
          libs/gda-balancing/pyproject.toml
          uv.lock

    - name: Install dependencies
      shell: bash
      # --all-packages installs every workspace member (gda + gda-balancing)
      # into the one venv, putting the member's console script on PATH for its
      # entry-point smoke tests. gda's own closure is unchanged (the member is
      # not a gda dependency).
      run: uv sync --frozen --dev --all-packages
