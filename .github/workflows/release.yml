name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Serialize release runs among themselves (never cancel an in-flight build).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# release-please is the single authority for the version (ADR-0008): every
# version-bearing file — pyproject.toml, the manifest, uv.lock, the tag,
# CHANGELOG.md — is a release-please-authored output, and a release happens
# only by merging the Release PR. There is no manual escape hatch; forcing a
# specific version uses release-please's `release-as` and recovering a failed
# release uses "Re-run failed jobs" (ADR-0007).

# Toolchain versions (Python, Godot) remain the single source pinned in the
# shared composite actions under .github/actions, so CI and Release agree.

# release-please runs twice, bracketing the verify-and-build chain: a draft
# release carries no git tag until published, and release-please's lookback is
# tag-based, so computing the next Release PR before the publish reads the
# whole history as unreleased and proposes a spurious release (#79). The
# release-pr phase additionally gates on the manifest version's tag actually
# existing: a failed publish leaves a tag-less draft, and without that gate a
# later ordinary push would run release-please against the missing tag and
# regenerate the spurious full-history Release PR across runs (#82).

jobs:
  cut-release:
    name: Cut draft release for a merged Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Load-bearing despite skip-github-pull-request: release-please relabels
      # the merged Release PR (autorelease: pending -> tagged) when it cuts the
      # release. Removing this silently breaks that relabel and re-opens #82.
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # The commit release-please tagged the release at — not necessarily the
      # push HEAD, so build-release builds the right tree under concurrency (#83).
      sha: ${{ steps.release.outputs.sha }}
      # The non-root package's outputs are path-prefixed while the root's stay
      # unprefixed (ADR-0037), so the gda tail above is untouched by the
      # gda-balancing tail below and a run can carry either, both, or neither
      # release.
      balancing_release_created: ${{ steps.release.outputs['libs/gda-balancing--release_created'] }}
      balancing_tag_name: ${{ steps.release.outputs['libs/gda-balancing--tag_name'] }}
      balancing_sha: ${{ steps.release.outputs['libs/gda-balancing--sha'] }}
    steps:
      - name: Run release-please (release cutting only)
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build-release:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    needs: cut-release
    # Run when release-please just cut a release (draft).
    if: >-
      !failure() && !cancelled() &&
      needs.cut-release.outputs.release_created == 'true'
    # Deliberately NO id-token here: the job that runs project, test, and
    # build-backend code must never hold PyPI publishing authority. OIDC lives
    # only in the isolated publish-pypi job below, so an injected build/test path
    # cannot mint a PyPI credential (ADR-0016).
    permissions:
      contents: read

    env:
      RELEASE_TAG: ${{ needs.cut-release.outputs.tag_name }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          # Build from the exact commit release-please tagged the release at,
          # not the push HEAD: under concurrency queue replacement a later
          # push's run can cut an earlier merged Release PR, so github.sha may
          # be ahead of the tagged commit and the version check would not catch
          # it (the version is unchanged across the intervening commits) (#83).
          ref: ${{ needs.cut-release.outputs.sha }}

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # The gda release train touches only the root project (ADR-0038).
          sync: root

      - name: Run unit tests
        run: uv run --frozen pytest -m "not e2e"

      # install-godot also installs the matching export templates, so this job can
      # run the #301 template-gate behavioural proof (it exports a real template
      # binary). Every other e2e needs only the editor binary.
      - name: Install Godot
        uses: ./.github/actions/install-godot

      - name: Run Godot e2e tests
        # -rs surfaces skip reasons (absent export templates, no DisplayServer) so a
        # silently-skipped e2e is visible in the release log, not mistaken for a pass.
        run: uv run --frozen pytest -m e2e -rs

      # The expected tag is DERIVED by scripts/release_tags.py, the single
      # authority shared with the member build job and the release-PR tag gate
      # below. Composing it here would be a second implementation that a
      # supported config change (include-v-in-tag, tag-separator) could put out
      # of step with the tag release-please actually mints.
      - name: Validate release tag
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected_tag="$(uv run python scripts/release_tags.py --tag-for . --version "$version")"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag ${RELEASE_TAG} does not match pyproject.toml version ${version}; expected ${expected_tag}" >&2
            exit 1
          fi
          echo "Release tag ${RELEASE_TAG} matches pyproject.toml version ${version}."

      - name: Build distributions
        run: uv build

      # Build once here (in the no-OIDC job) and hand the sdist+wheel to both
      # publish jobs as a run-scoped artifact. This keeps the build-backend
      # invocation out of any job that holds publishing authority, and keeps PyPI
      # and the GitHub Release byte-identical. overwrite:true so a "Re-run failed
      # jobs" that re-runs this job re-uploads cleanly (ADR-0016).
      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gda-release-distributions
          path: dist/
          if-no-files-found: error
          overwrite: true

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs:
      - cut-release
      - build-release
    # Run on any non-cancelled post-cut outcome — the guard step below decides
    # pass/fail — instead of letting a failed build-release SKIP this job.
    # "Re-run failed jobs" reliably re-runs FAILED jobs and their dependents, but
    # whether it re-runs a job that was SKIPPED because an upstream failed is
    # undocumented; relying on it would strand ADR-0007's recovery path. Turning
    # an upstream failure into an explicit failure of THIS job keeps the whole
    # post-cut tail re-runnable. Gated on release_created so ordinary pushes that
    # cut nothing still skip it.
    if: ${{ !cancelled() && needs.cut-release.outputs.release_created == 'true' }}
    #
    # Runs BEFORE publish-github-release. Un-drafting the GitHub Release (the next
    # job) is what creates the git tag — ADR-0007's atomic "release succeeded"
    # signal — so a PyPI failure here means no tag is minted (ADR-0016).
    #
    # This job holds id-token: write and NOTHING else, and runs no project, test,
    # or build code — it only downloads the prebuilt artifact and publishes it.
    # That isolation is the supply-chain boundary the PyPA action calls for: PyPI
    # publishing authority never overlaps the build/test environment.
    permissions:
      id-token: write
    # Scope the OIDC trust to a named GitHub Environment so only this job can mint
    # a PyPI-publishable token; the PyPI trusted publisher is configured with this
    # exact environment name. No protection rules: the release stays fully
    # automated and the human gate remains the Release PR merge (ADR-0007/0016).
    environment:
      name: pypi
      url: https://pypi.org/p/gda
    steps:
      # Fail (don't silently skip) when the build did not succeed, so this is a
      # FAILED job that "Re-run failed jobs" re-runs — not a skipped one whose
      # re-run is undocumented.
      - name: Require the build to have succeeded
        if: ${{ needs.build-release.result != 'success' }}
        run: |
          echo "build-release did not succeed (result: ${{ needs.build-release.result }})." >&2
          echo "Failing so 'Re-run failed jobs' re-runs this job once the build is repaired." >&2
          exit 1

      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: gda-release-distributions
          path: dist/

      # Idempotent via skip-existing: PyPI files are immutable, so a re-run from
      # the same tagged commit skips whatever already landed and uploads the rest,
      # mirroring the --clobber idempotency of the gh release upload downstream.
      # The trusted publisher for `gda` is configured (#207); this step failing
      # is therefore a real publish failure, and it gates tag creation on a
      # working publisher — no tag is minted unless PyPI accepted the upload.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - cut-release
      - publish-pypi
    # Same run-on-failure rationale as publish-pypi: run on any non-cancelled
    # post-cut outcome so a failed publish-pypi makes THIS job fail (via the guard
    # below) rather than skip — keeping it in the set "Re-run failed jobs" re-runs,
    # so recovery drives through to tag creation once PyPI is repaired (ADR-0007 /
    # ADR-0016). Gated on release_created so ordinary pushes skip it.
    if: ${{ !cancelled() && needs.cut-release.outputs.release_created == 'true' }}
    # Only contents: write here, no id-token. The un-draft below creates the tag
    # — ADR-0007's commit point — and the guard ensures it runs only after PyPI
    # has actually published.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.cut-release.outputs.tag_name }}
    steps:
      # Fail before the un-draft when PyPI did not publish: this both prevents a
      # tag from being minted without a PyPI release AND makes this a FAILED (not
      # skipped) job that "Re-run failed jobs" reliably re-runs.
      - name: Require the PyPI publish to have succeeded
        if: ${{ needs.publish-pypi.result != 'success' }}
        run: |
          echo "publish-pypi did not succeed (result: ${{ needs.publish-pypi.result }})." >&2
          echo "Failing before the un-draft so no tag is created; 'Re-run failed jobs' re-runs this once PyPI is repaired." >&2
          exit 1

      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: gda-release-distributions
          path: dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Attach artifacts to the draft release release-please created, then
          # publish (publishing also creates the git tag).
          # --clobber makes the upload idempotent so "Re-run failed jobs"
          # recovers a partial publish instead of erroring on existing
          # assets and leaving a stranded tag-less draft (#84). Both commands
          # are no-ops if already done, so re-running converges to published.
          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          # --latest pins the Latest badge to this release even if an earlier
          # draft is published out of order (#87).
          gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

  # --- gda-balancing tail (ADR-0037) -------------------------------------------
  # A mirror of the three gda jobs above, keyed on gda-balancing's path-prefixed
  # cut-release outputs and its own PyPI environment, so the two products'
  # release trains are independent: neither can publish the other, and a run
  # that cuts only one leaves the other's jobs skipped. gda-balancing ships no
  # engine-facing code, so its build job runs the package suite only — no Godot.
  # "member" below means a non-root release-please package: gda-balancing is an
  # independent uv project, NOT a uv workspace member (ADR-0038), which is why
  # these jobs sync and build only its own project.

  build-release-gda-balancing:
    name: Build and verify gda-balancing release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: cut-release
    if: >-
      !failure() && !cancelled() &&
      needs.cut-release.outputs.balancing_release_created == 'true'
    # Deliberately NO id-token, exactly as in build-release: the job that runs
    # project, test, and build-backend code never holds publishing authority
    # (ADR-0016).
    permissions:
      contents: read

    env:
      RELEASE_TAG: ${{ needs.cut-release.outputs.balancing_tag_name }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.cut-release.outputs.balancing_sha }}

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # ONLY the member: gda-balancing is an independent uv project
          # (ADR-0038) and its release train must not resolve, install, or
          # depend on anything from the root gda project.
          sync: member

      # The member is engine- and game-agnostic by construction (its isolation
      # gate is part of this suite), so there is no e2e tier to install Godot for.
      - name: Verify gda-balancing test and vector inventory
        run: |
          mkdir -p test-results
          uv run --frozen --project libs/gda-balancing \
            python libs/gda-balancing/tools/ci.py verify-inventory \
            --report test-results/inventory.json

      - name: Run gda-balancing tests
        run: |
          set -o pipefail
          process_timeout="$(uv run --no-project --python 3.13 python \
            libs/gda-balancing/tools/ci.py process-timeout unfiltered)"
          timeout --signal=TERM --kill-after=30s "${process_timeout}s" \
            uv run --frozen --project libs/gda-balancing pytest \
              libs/gda-balancing/tests -q --durations=50 \
              --junitxml=test-results/release-junit.xml \
            2>&1 | tee test-results/release.log

      - name: Summarize durations and verify release outcomes
        if: ${{ always() }}
        run: |
          if [ -f test-results/release-junit.xml ]; then
            uv run --no-project --python 3.13 python \
              libs/gda-balancing/tools/ci.py summarize-junit \
              --junit test-results/release-junit.xml \
              --report test-results/release-durations.json
            uv run --no-project --python 3.13 python \
              libs/gda-balancing/tools/ci.py verify-outcomes \
              --junit test-results/release-junit.xml \
              --report test-results/release-outcomes.json
          else
            printf '{"error":"release suite timed out before JUnit was finalized"}\n' \
              > test-results/release-durations.json
            printf '{"error":"release suite timed out before JUnit was finalized"}\n' \
              > test-results/release-outcomes.json
          fi

      - name: Upload release validation inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gda-balancing-release-validation
          path: test-results/
          if-no-files-found: error
          overwrite: true

      # Same derivation as the root build job — scripts/release_tags.py is the
      # one authority. The tag prefix is NOT restated here: it follows from the
      # package's `component` plus the four inherited tag inputs, so a config
      # change moves this check and release-please together.
      - name: Validate release tag
        run: |
          version="$(uv run --project libs/gda-balancing python -c 'import tomllib; print(tomllib.load(open("libs/gda-balancing/pyproject.toml", "rb"))["project"]["version"])')"
          expected_tag="$(uv run --project libs/gda-balancing python scripts/release_tags.py --tag-for libs/gda-balancing --version "$version")"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag ${RELEASE_TAG} does not match libs/gda-balancing/pyproject.toml version ${version}; expected ${expected_tag}" >&2
            exit 1
          fi
          echo "Release tag ${RELEASE_TAG} matches libs/gda-balancing/pyproject.toml version ${version}."

      - name: Build distributions
        run: uv build --project libs/gda-balancing --out-dir dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gda-balancing-release-distributions
          path: dist/
          if-no-files-found: error
          overwrite: true

  publish-pypi-gda-balancing:
    name: Publish gda-balancing to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs:
      - cut-release
      - build-release-gda-balancing
    # Same run-on-failure rationale as publish-pypi: an upstream failure must
    # FAIL this job rather than skip it, so "Re-run failed jobs" re-runs the
    # whole member tail (ADR-0007).
    if: ${{ !cancelled() && needs.cut-release.outputs.balancing_release_created == 'true' }}
    permissions:
      id-token: write
    # A DISTINCT environment from the root's `pypi`: the OIDC trust tuple is
    # (owner, repo, workflow, environment), so sharing one environment would let
    # either product's publish job mint a token valid for the other. The PyPI
    # trusted publisher for gda-balancing is configured with this exact name. No
    # protection rules, matching the root's posture — the human gate is the
    # Release PR merge (ADR-0007/0016/0037).
    environment:
      name: pypi-gda-balancing
      url: https://pypi.org/p/gda-balancing
    steps:
      - name: Require the build to have succeeded
        if: ${{ needs.build-release-gda-balancing.result != 'success' }}
        run: |
          echo "build-release-gda-balancing did not succeed (result: ${{ needs.build-release-gda-balancing.result }})." >&2
          echo "Failing so 'Re-run failed jobs' re-runs this job once the build is repaired." >&2
          exit 1

      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: gda-balancing-release-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-github-release-gda-balancing:
    name: Publish gda-balancing GitHub Release
    runs-on: ubuntu-latest
    needs:
      - cut-release
      - publish-pypi-gda-balancing
    if: ${{ !cancelled() && needs.cut-release.outputs.balancing_release_created == 'true' }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.cut-release.outputs.balancing_tag_name }}
    steps:
      - name: Require the PyPI publish to have succeeded
        if: ${{ needs.publish-pypi-gda-balancing.result != 'success' }}
        run: |
          echo "publish-pypi-gda-balancing did not succeed (result: ${{ needs.publish-pypi-gda-balancing.result }})." >&2
          echo "Failing before the un-draft so no tag is created; 'Re-run failed jobs' re-runs this once PyPI is repaired." >&2
          exit 1

      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: gda-balancing-release-distributions
          path: dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          # NOT --latest: the repo-global Latest badge stays pinned to the gda
          # product's releases (#87), which a member release must not steal.
          gh release edit "$RELEASE_TAG" --draft=false --latest=false --repo "$GITHUB_REPOSITORY"

  release-pr:
    name: Maintain release PR
    runs-on: ubuntu-latest
    needs:
      - cut-release
      - build-release
      - publish-pypi
      - publish-github-release
      - build-release-gda-balancing
      - publish-pypi-gda-balancing
      - publish-github-release-gda-balancing
    # Runs after any cut release is published. The same-run `needs` only sees
    # this run's job statuses, but the hazard is repo-global and survives the
    # run: a failed verify-and-build chain leaves a tag-less draft whose merged
    # Release PR is already labeled "autorelease: tagged", so a later ordinary
    # push reaches here with everything merely skipped. The tag_gate step below
    # is the actual guard — it refuses maintenance unless the manifest version's
    # tag exists (#82). On pushes that cut no release the build/publish chain is
    # skipped and this still runs.
    if: >-
      !failure() && !cancelled()
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the release manifest
        uses: actions/checkout@v6

      # Establishes uv on the repo's pinned Python for this whole job — the tag
      # gate below and the lock sync at the end both need it. `sync: none`
      # because scripts/release_tags.py is stdlib-only and the lock sync runs
      # `uv lock`, so neither project's environment needs resolving; the point
      # is the PINNED INTERPRETER, since a bare `python3` is whatever the runner
      # image ships and neither .python-version nor a project .venv redirects
      # it.
      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          sync: none
          # This job syncs no dependencies, so it has no closure worth saving.
          save-cache: "false"

      # The gate covers EVERY manifest package (ADR-0037): a tag-less draft in
      # any component re-opens #82's spurious-full-history-PR hazard for that
      # component's train. A component still at the `0.0.0` placeholder has
      # never released and has no tag to require — release-please's first bump
      # can never produce 0.0.0, so the placeholder is an unambiguous
      # never-released marker. Requiring its tag anyway would deadlock BOTH
      # trains: the member has no tag until its first release, and without
      # maintenance no Release PR proposing that release is ever created.
      - name: Require every released component's tag before maintaining the release PR
        id: tag_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag identity is DERIVED by scripts/release_tags.py, never restated
          # here — the same authority the two build jobs above validate against,
          # so all three agree by construction. It reads all FOUR inherited tag
          # inputs (`component`, `include-component-in-tag`, `include-v-in-tag`,
          # `tag-separator`), skips never-released placeholder packages, and
          # fails loudly on a config it cannot derive from.
          #
          # `--no-project` keeps the stdlib-only claim honest (no lock read, no
          # venv resolved); `--python 3.13` pins the interpreter rather than
          # inheriting the runner image's `python3`.
          required="$(uv run --no-project --python 3.13 python scripts/release_tags.py --required-tags)"

          missing=""
          for tag in $required; do
            # Bounded retry: a tag created by the publish step moments ago may not
            # be visible immediately (read-after-write), which would otherwise let
            # an all-green release run still regenerate the spurious PR (#79/#82).
            found=false
            for attempt in $(seq 1 6); do
              if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
                echo "Tag ${tag} is visible."
                found=true
                break
              fi
              echo "Tag ${tag} not visible yet (attempt ${attempt}/6); waiting 5s..."
              sleep 5
            done
            if [ "$found" = false ]; then
              missing="${missing} ${tag}"
            fi
          done

          if [ -z "$missing" ]; then
            echo "Every released component's tag is visible; maintaining the release PR."
            echo "tag_present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag_present=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Release pipeline needs recovery::Tag(s)${missing} for the current manifest version(s) do not exist, so release-PR maintenance is skipped to avoid regenerating a spurious full-history Release PR (#79). A previous release likely failed to publish, leaving a tag-less draft. See ADR-0007 for recovery."

      - name: Run release-please (release PR maintenance only)
        id: release
        if: steps.tag_gate.outputs.tag_present == 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      # Bring both uv.lock files under release-please's single version authority
      # (ADR-0008): release-please bumps pyproject.toml/the manifest but never
      # touches a lock's editable self-version, so it would drift every release
      # (#97). Regenerate the locks on the Release PR branch so each lock's
      # self-version tracks its bumped pyproject.toml and both land in the same PR.
      #
      # Both steps run only when maintenance ran (tag_present) AND at least one
      # Release PR exists (steps.release.outputs.prs is the JSON array of
      # PullRequest objects, unset otherwise), so a normal no-op push that
      # maintains nothing is unaffected. With two manifest packages and
      # separate-pull-requests (ADR-0037), each package gets its own Release PR
      # and each needs ITS lock synced — the two projects lock independently
      # now (ADR-0038), so there is no longer one lock recording both versions.
      #
      # uv is already installed for this job by the setup step above (the tag
      # gate needs the same pinned interpreter), so there is no separate uv
      # setup here — one toolchain step per job, not two that could drift.

      # release-please force-updates its branches each run, so this re-applies
      # the locks each run — intended: every Release PR branch ends every run
      # with its lock synced. Pushes with the default GITHUB_TOKEN do not
      # trigger workflows (recursion guard), which is fine here. uv sync
      # --frozen would NOT rewrite a lock, so we run uv lock. On a branch whose
      # locks are already in sync the loop body is a no-op.
      #
      # Both locks are refreshed on EVERY Release PR branch and then only the
      # one that actually changed is committed. Deriving which lock to touch
      # from the branch name would mean parsing release-please's branch-naming
      # convention — a second, brittle authority on package identity. Running
      # both is idempotent (a lock already in sync produces no diff), so "which
      # package is this branch for?" is answered by the diff, not by a guess.
      - name: Sync the uv.lock files on the Release PR branches
        if: steps.tag_gate.outputs.tag_present == 'true' && steps.release.outputs.prs
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          branches="$(echo "$RELEASE_PRS" | uv run --no-project --python 3.13 python -c 'import json, sys
          for pr in json.load(sys.stdin):
              name = pr.get("headBranchName", "")
              if name:
                  print(name)')"
          if [[ -z "$branches" ]]; then
            # Fall back to release-please's root branch-naming convention.
            branches="release-please--branches--${GITHUB_REF_NAME}"
            echo "Release PR JSON had no headBranchName; falling back to ${branches}."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r branch; do
            git fetch origin "$branch"
            # -B ... FETCH_HEAD is robust regardless of the narrow refspec
            # actions/checkout configures: a bare `git checkout "$branch"` would
            # fail because the bare fetch updates only FETCH_HEAD, not origin/$branch.
            git checkout -B "$branch" FETCH_HEAD
            uv lock
            uv lock --project libs/gda-balancing
            if git diff --quiet -- uv.lock libs/gda-balancing/uv.lock; then
              echo "Both uv.lock files already in sync on ${branch}; nothing to do."
              continue
            fi
            # Stage only the lock(s) that actually changed — `git add` on an
            # unchanged path is a no-op, so naming both is safe and keeps the
            # commit to whichever package this branch releases.
            git add uv.lock libs/gda-balancing/uv.lock
            git commit -m "chore: sync uv.lock with the release version"
            git push origin "HEAD:${branch}"
          done <<< "$branches"
