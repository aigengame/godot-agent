name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release manually (escape hatch), e.g. v0.1.0"
        required: true
        type: string
      draft:
        description: "Create the manual release as a draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the manual release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Serialize release runs; never cancel an in-flight release build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  GODOT_VERSION: "4.6-stable"
  GDA_GODOT: ${{ github.workspace }}/.godot/Godot_v4.6-stable_linux.x86_64

# release-please runs twice, bracketing the verify-and-build chain: a draft
# release carries no git tag until published, and release-please's lookback is
# tag-based, so computing the next Release PR before the publish reads the
# whole history as unreleased and proposes a spurious release (#79). The
# release-pr phase additionally gates on the manifest version's tag actually
# existing: a failed publish leaves a tag-less draft, and without that gate a
# later ordinary push would run release-please against the missing tag and
# regenerate the spurious full-history Release PR across runs (#82).

jobs:
  cut-release:
    name: Cut draft release for a merged Release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please (release cutting only)
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  github-release:
    name: Build, verify, and publish release artifacts
    runs-on: ubuntu-latest
    needs: cut-release
    # Run when release-please just cut a release (draft), or on the manual
    # escape hatch (the cut-release job is skipped on workflow_dispatch).
    if: >-
      !failure() && !cancelled() &&
      (needs.cut-release.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.cut-release.outputs.tag_name }}
      RELEASE_DRAFT: ${{ inputs.draft || false }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease || false }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          # The release-please tag may not exist yet (draft release), but the
          # push that triggered this run is exactly the tagged release commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run unit tests
        run: uv run --frozen pytest -m "not e2e"

      - name: Install Godot
        run: |
          mkdir -p .godot
          curl --fail --location --show-error \
            --output .godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q .godot/godot.zip -d .godot
          chmod +x "${GDA_GODOT}"
          "${GDA_GODOT}" --headless --version

      - name: Run Godot e2e tests
        run: uv run --frozen pytest -m e2e

      - name: Validate release tag
        run: |
          uv run python - <<'PY'
          import os
          import tomllib

          release_tag = os.environ["RELEASE_TAG"]
          if not release_tag.startswith("v"):
              raise SystemExit(f"Release tag must start with 'v': {release_tag}")

          with open("pyproject.toml", "rb") as pyproject:
              version = tomllib.load(pyproject)["project"]["version"]

          expected_tag = f"v{version}"
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag} does not match pyproject.toml version {version}; "
                  f"expected {expected_tag}"
              )
          PY

      - name: Build distributions
        run: uv build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual escape hatch: create a release from an existing tag.
            release_args=(
              --repo "$GITHUB_REPOSITORY"
              --verify-tag
              --generate-notes
            )

            if [[ "$RELEASE_DRAFT" == "true" ]]; then
              release_args+=(--draft)
            fi

            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              release_args+=(--prerelease)
            fi

            gh release create "$RELEASE_TAG" dist/* "${release_args[@]}"
          else
            # release-please path: attach artifacts to the draft release it
            # created, then publish (publishing also creates the git tag).
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi

  release-pr:
    name: Maintain release PR
    runs-on: ubuntu-latest
    needs:
      - cut-release
      - github-release
    # Runs after any cut release is published. The same-run `needs` only sees
    # this run's job statuses, but the hazard is repo-global and survives the
    # run: a failed verify-and-build chain leaves a tag-less draft whose merged
    # Release PR is already labeled "autorelease: tagged", so a later ordinary
    # push reaches here with everything merely skipped. The tag_gate step below
    # is the actual guard — it refuses maintenance unless the manifest version's
    # tag exists (#82). On pushes that cut no release the github-release job is
    # skipped and this still runs.
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the release manifest
        uses: actions/checkout@v6

      - name: Require the manifest version's tag before maintaining the release PR
        id: tag_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")"
          tag="v${version}"
          # Bounded retry: a tag created by the publish step moments ago may not
          # be visible immediately (read-after-write), which would otherwise let
          # an all-green release run still regenerate the spurious PR (#79/#82).
          for attempt in $(seq 1 6); do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} is visible; maintaining the release PR."
              echo "tag_present=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag ${tag} not visible yet (attempt ${attempt}/6); waiting 5s..."
            sleep 5
          done
          echo "tag_present=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Release pipeline needs recovery::Tag ${tag} for the current manifest version does not exist, so release-PR maintenance is skipped to avoid regenerating a spurious full-history Release PR (#79). A previous release likely failed to publish, leaving a tag-less draft. See ADR-0007 for recovery."

      - name: Run release-please (release PR maintenance only)
        if: steps.tag_gate.outputs.tag_present == 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
