name: CI

on:
  # Deliberately the DEFAULT pull_request activity types (opened, synchronize,
  # reopened) — notably NOT `edited`. Everything in this workflow is a function
  # of the tree, so editing a PR's title or body cannot change its outcome and
  # re-running the whole suite (including a Godot install) for a typo fix would
  # be pure waste. The one check that IS a function of the title lives in
  # release-scope-guard.yml, which subscribes to `edited` for exactly that
  # reason.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run-e2e:
        description: "Run tests that require a real Godot binary"
        required: false
        default: false
        type: boolean
  schedule:
    # Nightly (03:24 UTC) runs the godot-e2e job. workflow_dispatch with
    # run-e2e is the on-demand engine-test path. Daily execution detects an
    # engine-tier regression within one day. gda-balancing has its own
    # nightly in gda-balancing.yml.
    - cron: "24 3 * * *"

permissions:
  contents: read

concurrency:
  # Scheduled and manually requested evidence runs must not be cancelled by a
  # push merely because all three can target refs/heads/main. PR and push runs
  # still replace stale runs for the same ref.
  group: >-
    ${{
      github.workflow
    }}-${{
      (github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch') &&
        format('{0}-{1}', github.event_name, github.run_id) ||
        github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'pull_request' ||
      github.event_name == 'push'
    }}

jobs:
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # ruff is file-based and gates the whole repo from the root
          # environment, so the member project need not be synced (ADR-0038).
          sync: root
          # The python job already populates the dependency cache for this key;
          # this job only reads it, so skip a redundant (racing) cache save.
          save-cache: false

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

  gda-scope:
    name: Classify gda scope
    # Only a pull request has a change set to classify. On every other event
    # this job is skipped, and the gda jobs run.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.classify.outputs.decision }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The change set starts at the merge base, so a change that exists
          # only on main is not counted. Disable rename collapsing so a file
          # moved into gda-balancing also lists its source path. The gda jobs
          # are skipped only for a change set that is not empty and is
          # entirely inside libs/gda-balancing/.
          git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" \
            > changed-paths.txt
          if [ -s changed-paths.txt ] &&
            ! grep -qv '^libs/gda-balancing/' changed-paths.txt; then
            decision=skip
          else
            decision=run
          fi
          echo "decision=${decision}" >> "$GITHUB_OUTPUT"
          echo "gda jobs: ${decision}"

  type-check:
    name: Type check (pyright)
    needs: gda-scope
    # Run unless the scope job succeeded and returned "skip". `!cancelled()`
    # replaces the implicit success() check, so this job also runs when the
    # scope job is skipped (every event except a pull request) or fails.
    if: ${{ !cancelled() && !(needs.gda-scope.result == 'success' && needs.gda-scope.outputs.decision == 'skip') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # gda-balancing type-checks in its own workflow (ADR-0038).
          sync: root
          # The python job already populates the dependency cache for this key;
          # this job only reads it, so skip a redundant (racing) cache save.
          save-cache: false

      - name: Type check
        # Scope (src + tests) and mode (basic) come from [tool.pyright] in pyproject (ADR-0030).
        run: uv run --frozen pyright

  python:
    name: Python unit tests and package build
    needs: gda-scope
    # The same condition as type-check.
    if: ${{ !cancelled() && !(needs.gda-scope.result == 'success' && needs.gda-scope.outputs.decision == 'skip') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # lfs: true materializes any Git-LFS-tracked assets (gADR-0015) so the Panda
        # Adventure size gate and asset loads see real bytes. A no-op until wave-3
        # commits its first >= T asset; provisioned now so a large file is born in LFS.
        uses: actions/checkout@v6
        with:
          lfs: true
          # The harness-version guard compares the PR/push base and head.
          fetch-depth: 0

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # gda-balancing has its own workflow and stable aggregator.
          # Keep this required root context scoped to the root project.
          sync: root

      - name: Guard harness version identity
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/harness_version_guard.py "$BASE_SHA" "$HEAD_SHA"

      - name: Run unit tests
        # Four workers (the runner has four vCPUs); `loadgroup` keeps the
        # `xdist_group`-marked tests together and load-balances the rest (#818).
        run: uv run --frozen pytest -m "not e2e" -n 4 --dist loadgroup

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gda-distributions
          path: dist/
          if-no-files-found: error

  godot-e2e:
    name: Godot e2e tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs['run-e2e']) }}

    steps:
      - name: Checkout repository
        # lfs: true so the engine/e2e asset loads and the export path see real
        # LFS-tracked bytes, not pointer files (gADR-0015). A no-op until wave-3.
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # Engine-backed tiers are gda's and the example game's only; the
          # member ships no engine-facing code (ADR-0038).
          sync: root
          save-cache: false

      # install-godot also installs the matching export templates, so this job can
      # run the #301 template-gate behavioural proof (it exports a real template
      # binary). Every other e2e needs only the editor binary.
      - name: Install Godot
        uses: ./.github/actions/install-godot

      - name: Run Godot e2e tests
        # -rs surfaces skip reasons in the log (e.g. absent export templates, or no
        # DisplayServer for windowed capture), so a silently-skipped e2e is visible
        # rather than mistaken for a pass.
        # Four workers, as the unit step; every e2e spawn has its own project,
        # user-data placement and daemon socket dir, and the windowed tests are
        # grouped on one worker (#818).
        run: uv run --frozen pytest -m e2e -rs -n 4 --dist loadgroup

      # Portable export guard: `export get` validates the macOS preset is found and
      # parses (no templates or platform tooling needed), so it is safe on a Linux
      # runner. `export run --mode pack` works on macOS (verified) but a macOS preset
      # on a Linux runner is unverified here, so we keep `get`. The REAL .app export
      # is reproduced by scripts/export_macos.sh and smoke-tested on macOS (see PR).
      - name: Guard Panda Adventure export preset wiring
        run: uv run --frozen gda export get --preset macOS --project examples/platformer/panda-adventure --json
