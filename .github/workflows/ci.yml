name: CI

on:
  # Deliberately the DEFAULT pull_request activity types (opened, synchronize,
  # reopened) — notably NOT `edited`. Everything in this workflow is a function
  # of the tree, so editing a PR's title or body cannot change its outcome and
  # re-running the whole suite (including a Godot install) for a typo fix would
  # be pure waste. The one check that IS a function of the title lives in
  # release-scope-guard.yml, which subscribes to `edited` for exactly that
  # reason.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run-e2e:
        description: "Run tests that require a real Godot binary"
        required: false
        default: false
        type: boolean
  schedule:
    # Nightly (03:24 UTC) — the automatic, dependable trigger for the godot-e2e job
    # (workflow_dispatch with run-e2e is the on-demand extra). Daily so a regression in
    # the real-engine tier is caught within a day rather than up to a week.
    - cron: "24 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # ruff is file-based and gates the whole repo from the root
          # environment, so the member project need not be synced (ADR-0038).
          sync: root
          # The python job already populates the dependency cache for this key;
          # this job only reads it, so skip a redundant (racing) cache save.
          save-cache: false

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

  type-check:
    name: Type check (pyright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # One pyright run per project, each against its own resolved
          # dependencies — the two projects lock separately (ADR-0038).
          sync: both
          # The python job already populates the dependency cache for this key;
          # this job only reads it, so skip a redundant (racing) cache save.
          save-cache: false

      - name: Type check
        # Scope (src + tests) and mode (basic) come from [tool.pyright] in pyproject (ADR-0030).
        run: uv run --frozen pyright

      - name: Type check gda-balancing
        # gda-balancing is its own uv project (ADR-0038) with its own pyright
        # pin, so the run resolves from the member environment; pyright's
        # --project points at the member's [tool.pyright] scope (#502).
        run: uv run --frozen --project libs/gda-balancing pyright --project libs/gda-balancing

  python:
    name: Python unit tests and package build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # lfs: true materializes any Git-LFS-tracked assets (gADR-0015) so the Panda
        # Adventure size gate and asset loads see real bytes. A no-op until wave-3
        # commits its first >= T asset; provisioned now so a large file is born in LFS.
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # This job runs both products' suites and builds both distributions,
          # so it syncs both independent projects (ADR-0038). It is also the
          # job that populates the shared dependency cache for the others.
          sync: both

      - name: Run unit tests
        run: uv run --frozen pytest -m "not e2e"

      # The root testpaths excludes the example game; run its PURE-Python tier here
      # (no Godot). The "engine" and "e2e" tiers need a real engine and run in the
      # godot-e2e job; the "acquire_live" tier needs a live network / image-gen API
      # (asset pipeline, gADR-0014) and is run on demand, never in CI. Explicit
      # path keeps the game and gda suites separate.
      - name: Run Panda Adventure pure-Python tests
        run: uv run --frozen pytest examples/platformer/panda-adventure/tests -m "not e2e and not engine and not acquire_live"

      # gda-balancing is a separate uv project (ADR-0038), so its suite runs
      # against its OWN environment via --project — which is also what puts its
      # `gda-balancing` console script on PATH for the subprocess e2e tier.
      - name: Run gda-balancing tests
        run: uv run --frozen --project libs/gda-balancing pytest libs/gda-balancing/tests

      - name: Build distributions
        run: uv build

      # Build smoke only: proves the member's backend/layout stay buildable.
      # Not uploaded — the member's release build is the Release workflow's own
      # build-release-gda-balancing job (#528 wired its publish tail), and CI
      # ships no release artifacts for either package. Its own out-dir keeps the
      # member dists out of the gda-distributions artifact.
      - name: Build gda-balancing distributions
        run: uv build --project libs/gda-balancing --out-dir dist-gda-balancing

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gda-distributions
          path: dist/
          if-no-files-found: error

  coinstall-smoke:
    name: Both products co-install
    runs-on: ubuntu-latest

    # Replaces feedback the shared workspace lock used to give for free (ADR-0038).
    # While gda and gda-balancing resolved into one lock, uv proved on every
    # change that their dependency closures stay mutually satisfiable; two
    # independent locks each resolve alone and can silently drift into wheels
    # that cannot be installed side by side (a user who wants both, or a future
    # agent image carrying both, would hit it first). So the co-installability
    # claim becomes an explicit test: build both wheels, install them together
    # into one clean environment, and run a command from each.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # Neither project's venv is used here — the build backends run in
          # uv's own isolated build envs and the smoke install is a fresh venv.
          sync: none
          save-cache: false

      - name: Build both wheels
        run: |
          uv build --out-dir dist-coinstall
          uv build --project libs/gda-balancing --out-dir dist-coinstall

      - name: Install both into one clean environment and run each command
        run: |
          uv venv coinstall-venv
          uv pip install --python coinstall-venv/bin/python dist-coinstall/*.whl
          ./coinstall-venv/bin/gda --help
          ./coinstall-venv/bin/gda-balancing version

  godot-e2e:
    name: Godot e2e tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs['run-e2e']) }}

    steps:
      - name: Checkout repository
        # lfs: true so the engine/e2e asset loads and the export path see real
        # LFS-tracked bytes, not pointer files (gADR-0015). A no-op until wave-3.
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # Engine-backed tiers are gda's and the example game's only; the
          # member ships no engine-facing code (ADR-0038).
          sync: root
          save-cache: false

      # install-godot also installs the matching export templates, so this job can
      # run the #301 template-gate behavioural proof (it exports a real template
      # binary). Every other e2e needs only the editor binary.
      - name: Install Godot
        uses: ./.github/actions/install-godot

      - name: Run Godot e2e tests
        # -rs surfaces skip reasons in the log (e.g. absent export templates, or no
        # DisplayServer for windowed capture), so a silently-skipped e2e is visible
        # rather than mistaken for a pass.
        run: uv run --frozen pytest -m e2e -rs

      # The example game's engine-backed tiers: the data round-trip + logic seam
      # (engine marker) and the live daemon loop (e2e). install-godot exported
      # GDA_GODOT, so these resolve the engine. -rs surfaces any skips.
      - name: Run Panda Adventure engine and e2e tests
        run: uv run --frozen pytest examples/platformer/panda-adventure/tests -m "engine or e2e" -rs

      # Portable export guard: `export get` validates the macOS preset is found and
      # parses (no templates or platform tooling needed), so it is safe on a Linux
      # runner. `export run --mode pack` works on macOS (verified) but a macOS preset
      # on a Linux runner is unverified here, so we keep `get`. The REAL .app export
      # is reproduced by scripts/export_macos.sh and smoke-tested on macOS (see PR).
      - name: Guard Panda Adventure export preset wiring
        run: uv run --frozen gda export get --preset macOS --project examples/platformer/panda-adventure --json
