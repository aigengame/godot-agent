name: CI

on:
  # Deliberately the DEFAULT pull_request activity types (opened, synchronize,
  # reopened) — notably NOT `edited`. Everything in this workflow is a function
  # of the tree, so editing a PR's title or body cannot change its outcome and
  # re-running the whole suite (including a Godot install) for a typo fix would
  # be pure waste. The one check that IS a function of the title lives in
  # release-scope-guard.yml, which subscribes to `edited` for exactly that
  # reason.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run-e2e:
        description: "Run tests that require a real Godot binary"
        required: false
        default: false
        type: boolean
      e2e-shards:
        # A string, so that the e2e-plan job is the one validator: it refuses
        # anything but a positive integer (#1174).
        description: "Shards for the Godot e2e job (positive integer; 1 = one job)"
        required: false
        default: "4"
        type: string
      windows-probe:
        # The S0 probe job of #1228 runs only when this is set; the other jobs
        # of a dispatched run are unchanged by it.
        description: "Run the Windows probe job of #1228 S0"
        required: false
        default: false
        type: boolean
  schedule:
    # Nightly (03:24 UTC) runs the godot-e2e job, sharded by the repository
    # variable E2E_SHARDS (unset = 4 shards; 1 = one job). workflow_dispatch with
    # run-e2e is the on-demand engine-test path, sharded by its e2e-shards input. Daily
    # execution detects an engine-tier regression within one day. gda-balancing
    # has its own nightly in gda-balancing.yml.
    - cron: "24 3 * * *"

permissions:
  contents: read

concurrency:
  # Scheduled and manually requested evidence runs must not be cancelled by a
  # push merely because all three can target refs/heads/main. PR and push runs
  # still replace stale runs for the same ref.
  group: >-
    ${{
      github.workflow
    }}-${{
      (github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch') &&
        format('{0}-{1}', github.event_name, github.run_id) ||
        github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'pull_request' ||
      github.event_name == 'push'
    }}

env:
  # The xdist worker count for every pytest step. Empty or unset, the test
  # conftest's default applies (4, capped at the runner's CPU count); the
  # repository variable PYTEST_WORKERS overrides it for a runner with a
  # different CPU budget (#1173).
  PYTEST_XDIST_AUTO_NUM_WORKERS: ${{ vars.PYTEST_WORKERS }}

jobs:
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # ruff is file-based and gates the whole repo from the root
          # environment, so the member project need not be synced (ADR-0038).
          sync: root
          # The python job already populates the dependency cache for this key;
          # this job only reads it, so skip a redundant (racing) cache save.
          save-cache: false

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

  gda-scope:
    name: Classify gda scope
    # Only a pull request has a change set to classify. On every other event
    # this job is skipped, and the gda jobs run.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.classify.outputs.decision }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The change set starts at the merge base, so a change that exists
          # only on main is not counted. Disable rename collapsing so a file
          # moved into gda-balancing also lists its source path. The gda jobs
          # are skipped only for a change set that is not empty and is
          # entirely inside libs/gda-balancing/.
          git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" \
            > changed-paths.txt
          if [ -s changed-paths.txt ] &&
            ! grep -qv '^libs/gda-balancing/' changed-paths.txt; then
            decision=skip
          else
            decision=run
          fi
          echo "decision=${decision}" >> "$GITHUB_OUTPUT"
          echo "gda jobs: ${decision}"

  type-check:
    name: Type check (pyright)
    needs: gda-scope
    # Run unless the scope job succeeded and returned "skip". `!cancelled()`
    # replaces the implicit success() check, so this job also runs when the
    # scope job is skipped (every event except a pull request) or fails.
    if: ${{ !cancelled() && !(needs.gda-scope.result == 'success' && needs.gda-scope.outputs.decision == 'skip') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # gda-balancing type-checks in its own workflow (ADR-0038).
          sync: root
          # The python job already populates the dependency cache for this key;
          # this job only reads it, so skip a redundant (racing) cache save.
          save-cache: false

      - name: Type check
        # Scope (src + tests) and mode (basic) come from [tool.pyright] in pyproject (ADR-0030).
        run: uv run --frozen pyright

  python:
    name: Python unit tests and package build
    needs: gda-scope
    # The same condition as type-check.
    if: ${{ !cancelled() && !(needs.gda-scope.result == 'success' && needs.gda-scope.outputs.decision == 'skip') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The harness-version guard compares the PR/push base and head.
          fetch-depth: 0

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # gda-balancing has its own workflow and stable aggregator.
          # Keep this required root context scoped to the root project.
          sync: root

      - name: Guard harness version identity
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/harness_version_guard.py "$BASE_SHA" "$HEAD_SHA"

      - name: Run unit tests
        # The parallel policy (`-n auto --dist loadgroup`) is pyproject's `addopts`
        # and the worker default is the test conftest's, so this step is the entry
        # a developer runs; only the selection is stated here (#1173).
        run: uv run --frozen pytest -m "not e2e"

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gda-distributions
          path: dist/
          if-no-files-found: error

  e2e-plan:
    name: Plan the e2e shards
    # The trigger condition of the engine tier lives here; godot-e2e follows it
    # through `needs`. No checkout: the shard count is a dispatch input or a
    # repository variable, not a function of the tree (#1174).
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs['run-e2e']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      count: ${{ steps.plan.outputs.count }}
      groups: ${{ steps.plan.outputs.groups }}

    steps:
      - name: Decide the shard count
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHARDS: ${{ inputs['e2e-shards'] }}
          VAR_SHARDS: ${{ vars.E2E_SHARDS }}
        run: |
          # The dispatch input on an on-demand run, the repository variable on
          # the schedule; empty means the default of 4 shards (the input's own
          # default mirrors it), and 1 means one job. Anything but a positive
          # integer fails the run here, before any e2e job starts.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            count="${INPUT_SHARDS:-4}"
          else
            count="${VAR_SHARDS:-4}"
          fi
          if ! [[ "$count" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::e2e-shards / E2E_SHARDS must be a positive integer, got '${count}'"
            exit 1
          fi
          groups="[1"
          for ((k = 2; k <= count; k++)); do groups+=",${k}"; done
          groups+="]"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "groups=${groups}" >> "$GITHUB_OUTPUT"
          echo "e2e shards: ${count} ${groups}"

  godot-e2e:
    name: Godot e2e tests
    needs: e2e-plan
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not cancel the evidence of the others (#1174).
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.e2e-plan.outputs.groups) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # The engine-backed tiers are gda's only; the member ships no
          # engine-facing code (ADR-0038).
          sync: root
          save-cache: false

      # install-godot also installs the matching export templates, so this job can
      # run the #301 template-gate behavioural proof (it exports a real template
      # binary). Every other e2e needs only the editor binary.
      - name: Install Godot
        uses: ./.github/actions/install-godot

      - name: Run Godot e2e tests
        # `-rs` (in pyproject's `addopts`) surfaces skip reasons in the log (e.g.
        # absent export templates, or no DisplayServer for windowed capture), so a
        # silently-skipped e2e is visible rather than mistaken for a pass.
        # The worker count and `--dist loadgroup` come from `addopts` as in the
        # unit step; every e2e spawn has its own project, user-data placement and
        # daemon socket dir, and the windowed tests are grouped on one worker (#818).
        # On a sharded run this shard runs its `--group` of the tier, split by
        # `least_duration` so each directory spreads across the shards (by count
        # while no durations file exists); one shard passes no flag (#1174).
        run: uv run --frozen pytest -m e2e${{ needs.e2e-plan.outputs.count != '1' && format(' --splits {0} --group {1} --splitting-algorithm least_duration', needs.e2e-plan.outputs.count, matrix.group) || '' }}

      - name: Run rendered input and screen regressions on Xvfb
        # Shard 1 only: the rendered set is small and runs serially, so it is
        # not split (#1174).
        if: ${{ matrix.group == 1 }}
        # A real Unix DisplayServer verifies input-driven UI effects and screen
        # receipts; the ordinary engine selection above remains headless.
        # The `rendered` pytest marker selects the tests, so a new rendered test
        # runs here when it carries the marker, with no change to this step.
        # Serial (`-n 0`): the rendered tests share the one display and already
        # form one `xdist_group`, so extra workers would only idle (#1173).
        run: xvfb-run -a uv run --frozen pytest -m "e2e and rendered" -n 0

  windows-probe:
    name: "Windows probe (#1228 S0)"
    # One dispatched job that answers the four assumptions #1228 S0 states before
    # the Windows e2e leg exists: (a) symbolic-link creation by the runner account,
    # (b) the windowed display verdict, (c) whether an MSIX-packaged interpreter
    # reproduces the #1225 Job drop on the hosted image, and (d) the contents of
    # the pinned win64 zip. Dispatch only, behind its own input, so no pull-request,
    # push or scheduled run is changed. Each probe step runs even when an earlier
    # one failed; the summary and the artifact carry every answer. Removed or
    # folded into the Windows e2e leg once it has answered.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['windows-probe'] }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          sync: root
          save-cache: false

      - name: Probe (a) symbolic-link creation
        run: |
          New-Item -ItemType Directory -Force -Path probe | Out-Null
          uv run --frozen python .github/windows-probe/symlink_probe.py | Tee-Object -FilePath probe/symlink.json

      - name: Probe (b) windowed display verdict
        if: ${{ !cancelled() }}
        run: uv run --frozen python .github/windows-probe/display_probe.py | Tee-Object -FilePath probe/display.json

      - name: Probe (c) MSIX-packaged interpreter and Job ownership
        if: ${{ !cancelled() }}
        # Windows PowerShell 5.1, where the Appx deployment cmdlets live.
        shell: powershell
        run: |
          # The install the project venv was made from: a plain python.exe with its
          # Lib beside it, which is what the package wraps.
          $pythonDir = (uv run --frozen python -c "import sys; print(sys.base_prefix)").Trim()
          if (-not (Test-Path (Join-Path $pythonDir 'python.exe'))) { throw "no python.exe under $pythonDir" }
          & .github/windows-probe/msix_probe.ps1 `
            -PythonDir $pythonDir `
            -ProbeDir (Resolve-Path .github/windows-probe).Path `
            -WorkDir (Join-Path $env:RUNNER_TEMP 'msix-probe') `
            -ReportPath (Join-Path (Get-Location).Path 'probe\msix.json')

      - name: Probe (d) the pinned win64 zip
        if: ${{ !cancelled() }}
        env:
          # The install-godot default; S1 moves the Windows asset into that action.
          GODOT_VERSION: 4.6-stable
        run: |
          $zip = "Godot_v${env:GODOT_VERSION}_win64.exe.zip"
          $dir = Join-Path $env:RUNNER_TEMP 'godot-win64'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          curl.exe --fail --location --silent --show-error --output "$dir\$zip" `
            "https://github.com/godotengine/godot/releases/download/${env:GODOT_VERSION}/$zip"
          Expand-Archive -Path "$dir\$zip" -DestinationPath "$dir\unzipped" -Force
          $files = Get-ChildItem "$dir\unzipped" -Recurse -File | ForEach-Object { [ordered]@{ name = $_.Name; bytes = $_.Length } }
          $console = Get-ChildItem "$dir\unzipped" -Recurse -Filter '*_console.exe' | Select-Object -First 1
          $gui = Get-ChildItem "$dir\unzipped" -Recurse -File | Where-Object { $_.Name -like '*_win64.exe' } | Select-Object -First 1
          $versionOutput = $null
          $versionExit = $null
          if ($console) {
            $versionOutput = (& $console.FullName --headless --version 2>&1 | Out-String).Trim()
            $versionExit = $LASTEXITCODE
          }
          [ordered]@{
            probe = 'godot_zip'
            version = $env:GODOT_VERSION
            files = $files
            console = if ($console) { $console.Name } else { $null }
            gui = if ($gui) { $gui.Name } else { $null }
            version_output = $versionOutput
            version_exit_code = $versionExit
          } | ConvertTo-Json -Depth 4 | Tee-Object -FilePath probe/godot.json

      - name: Write the step summary
        if: ${{ always() }}
        run: |
          foreach ($file in Get-ChildItem probe -Filter *.json) {
            "### $($file.BaseName)", '```json', (Get-Content -Raw $file.FullName), '```', '' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload the probe report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-probe
          path: probe/
          if-no-files-found: error
