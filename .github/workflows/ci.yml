name: CI

on:
  # Deliberately the DEFAULT pull_request activity types (opened, synchronize,
  # reopened) — notably NOT `edited`. Everything in this workflow is a function
  # of the tree, so editing a PR's title or body cannot change its outcome and
  # re-running the whole suite (including a Godot install) for a typo fix would
  # be pure waste. The one check that IS a function of the title lives in
  # release-scope-guard.yml, which subscribes to `edited` for exactly that
  # reason.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run-e2e:
        description: "Run tests that require a real Godot binary"
        required: false
        default: false
        type: boolean
      run-balancing-unfiltered:
        description: "Run the complete unfiltered gda-balancing suite"
        required: false
        default: false
        type: boolean
  schedule:
    # Nightly (03:24 UTC) — the automatic, dependable trigger for the godot-e2e job
    # (workflow_dispatch with run-e2e is the on-demand extra). Daily so a regression in
    # the real-engine tier is caught within a day rather than up to a week.
    - cron: "24 3 * * *"

permissions:
  contents: read

concurrency:
  # Scheduled and manually requested unfiltered runs are evidence runs: a push
  # must not cancel them merely because all three can target refs/heads/main.
  # PR and push runs still replace stale runs for the same ref.
  group: >-
    ${{
      github.workflow
    }}-${{
      (github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch') &&
        format('{0}-{1}', github.event_name, github.run_id) ||
        github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'pull_request' ||
      github.event_name == 'push'
    }}

jobs:
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # ruff is file-based and gates the whole repo from the root
          # environment, so the member project need not be synced (ADR-0038).
          sync: root
          # The python job already populates the dependency cache for this key;
          # this job only reads it, so skip a redundant (racing) cache save.
          save-cache: false

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

  type-check:
    name: Type check (pyright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # One pyright run per project, each against its own resolved
          # dependencies — the two projects lock separately (ADR-0038).
          sync: both
          # The python job already populates the dependency cache for this key;
          # this job only reads it, so skip a redundant (racing) cache save.
          save-cache: false

      - name: Type check
        # Scope (src + tests) and mode (basic) come from [tool.pyright] in pyproject (ADR-0030).
        run: uv run --frozen pyright

      - name: Type check gda-balancing
        # gda-balancing is its own uv project (ADR-0038) with its own pyright
        # pin, so the run resolves from the member environment; pyright's
        # --project points at the member's [tool.pyright] scope (#502).
        run: uv run --frozen --project libs/gda-balancing pyright --project libs/gda-balancing

  balancing-scope:
    name: Classify gda-balancing scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.classify.outputs.required }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pinned policy interpreter
        # Classification is stdlib-only and latency-critical. Pin Python
        # directly instead of installing uv and syncing no project.
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Disable rename collapsing so a cross-boundary move supplies both
            # the deleted source path and added destination path. Otherwise an
            # affecting member file renamed into an unrelated docs path could
            # silently bypass the full matrix.
            git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" |
              python libs/gda-balancing/tools/ci.py classify \
                > balancing-scope.json
          else
            python libs/gda-balancing/tools/ci.py classify --all \
              > balancing-scope.json
          fi
          python -c \
            'import json, os; value=json.load(open("balancing-scope.json", encoding="utf-8")); open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8").write("required=%s\n" % str(value["required"]).lower())'
          cat balancing-scope.json

  python:
    name: Python unit tests and package build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # lfs: true materializes any Git-LFS-tracked assets (gADR-0015) so the Panda
        # Adventure size gate and asset loads see real bytes. A no-op until wave-3
        # commits its first >= T asset; provisioned now so a large file is born in LFS.
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # gda-balancing has its own required matrix and stable aggregator.
          # Keep this required root context scoped to the root project.
          sync: root

      - name: Run unit tests
        run: uv run --frozen pytest -m "not e2e"

      # The root testpaths excludes the example game; run its PURE-Python tier here
      # (no Godot). The "engine" and "e2e" tiers need a real engine and run in the
      # godot-e2e job; the "acquire_live" tier needs a live network / image-gen API
      # (asset pipeline, gADR-0014) and is run on demand, never in CI. Explicit
      # path keeps the game and gda suites separate.
      - name: Run Panda Adventure pure-Python tests
        run: uv run --frozen pytest examples/platformer/panda-adventure/tests -m "not e2e and not engine and not acquire_live"

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gda-distributions
          path: dist/
          if-no-files-found: error

  balancing-inventory:
    name: gda-balancing inventory closure
    needs: balancing-scope
    if: ${{ needs.balancing-scope.outputs.required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      test_matrix: ${{ steps.test_matrix.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up gda-balancing environment
        uses: ./.github/actions/setup-python-env
        with:
          sync: member

      - name: Verify unfiltered and shard inventory closure
        run: |
          mkdir -p test-results
          uv run --frozen --project libs/gda-balancing \
            python libs/gda-balancing/tools/ci.py verify-inventory \
            --report test-results/inventory.json
          uv run --frozen --project libs/gda-balancing \
            python libs/gda-balancing/tools/ci.py verify-claims \
            --report test-results/coverage-claims.json

      - name: Export required shard matrix
        id: test_matrix
        run: |
          value="$(uv run --no-project --python 3.13 python \
            libs/gda-balancing/tools/ci.py required-test-shards)"
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - name: Upload inventory report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gda-balancing-inventory
          path: test-results/
          if-no-files-found: error

  balancing-tests:
    name: gda-balancing tests (${{ matrix.shard }})
    needs:
      - balancing-scope
      - balancing-inventory
    if: ${{ needs.balancing-scope.outputs.required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The invalid sentinel keeps strategy expansion valid when inventory is
        # skipped. If this job is ever made unconditional, shard selection then
        # fails closed instead of silently executing only one real shard.
        shard: ${{ fromJSON(needs.balancing-inventory.outputs.test_matrix || '["__invalid__"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up gda-balancing environment
        uses: ./.github/actions/setup-python-env
        with:
          sync: member
          save-cache: false

      - name: Run complete shard with hard duration bound
        run: |
          mkdir -p test-results
          set -o pipefail
          process_timeout="$(uv run --no-project --python 3.13 python \
            libs/gda-balancing/tools/ci.py process-timeout required)"
          uv run --no-project --python 3.13 python \
            libs/gda-balancing/tools/ci.py shard-paths "${{ matrix.shard }}" |
            xargs timeout --signal=TERM --kill-after=30s "${process_timeout}s" \
              uv run --frozen --project libs/gda-balancing pytest \
              -q --durations=50 \
              --junitxml="test-results/junit-${{ matrix.shard }}.xml" \
            2>&1 | tee "test-results/${{ matrix.shard }}.log"

      - name: Summarize durations and verify test outcomes
        if: ${{ always() }}
        run: |
          mkdir -p test-results
          if [ -f "test-results/junit-${{ matrix.shard }}.xml" ]; then
            uv run --no-project --python 3.13 python \
              libs/gda-balancing/tools/ci.py summarize-junit \
              --junit "test-results/junit-${{ matrix.shard }}.xml" \
              --report "test-results/${{ matrix.shard }}-durations.json"
            uv run --no-project --python 3.13 python \
              libs/gda-balancing/tools/ci.py verify-outcomes \
              --junit "test-results/junit-${{ matrix.shard }}.xml" \
              --report "test-results/${{ matrix.shard }}-outcomes.json"
          else
            printf '{"error":"shard timed out before JUnit was finalized"}\n' \
              > "test-results/${{ matrix.shard }}-durations.json"
            printf '{"error":"shard timed out before JUnit was finalized"}\n' \
              > "test-results/${{ matrix.shard }}-outcomes.json"
          fi

      - name: Upload shard diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gda-balancing-${{ matrix.shard }}-diagnostics
          path: test-results/
          if-no-files-found: error

  balancing-smoke:
    name: gda-balancing wheel and subprocess smoke
    needs:
      - balancing-scope
      - balancing-inventory
    if: ${{ needs.balancing-scope.outputs.required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up gda-balancing environment
        uses: ./.github/actions/setup-python-env
        with:
          sync: member
          save-cache: false

      - name: Run subprocess tests and build with one hard duration bound
        run: |
          mkdir -p test-results
          process_timeout="$(uv run --no-project --python 3.13 python \
            libs/gda-balancing/tools/ci.py process-timeout required)"
          uv run --no-project --python 3.13 python \
            libs/gda-balancing/tools/ci.py shard-paths smoke \
            > test-results/smoke-paths.txt
          timeout --signal=TERM --kill-after=30s "${process_timeout}s" \
            bash -euo pipefail -c '
              xargs uv run --frozen --project libs/gda-balancing pytest \
                -q --durations=50 \
                --junitxml=test-results/junit-smoke.xml \
                < test-results/smoke-paths.txt \
                2>&1 | tee test-results/smoke.log
              uv build --project libs/gda-balancing --out-dir dist-gda-balancing
            '

      - name: Summarize durations and verify smoke outcomes
        if: ${{ always() }}
        run: |
          mkdir -p test-results
          if [ -f test-results/junit-smoke.xml ]; then
            uv run --no-project --python 3.13 python \
              libs/gda-balancing/tools/ci.py summarize-junit \
              --junit test-results/junit-smoke.xml \
              --report test-results/smoke-durations.json
            uv run --no-project --python 3.13 python \
              libs/gda-balancing/tools/ci.py verify-outcomes \
              --junit test-results/junit-smoke.xml \
              --report test-results/smoke-outcomes.json
          else
            printf '{"error":"smoke timed out before JUnit was finalized"}\n' \
              > test-results/smoke-durations.json
            printf '{"error":"smoke timed out before JUnit was finalized"}\n' \
              > test-results/smoke-outcomes.json
          fi

      - name: Upload smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gda-balancing-smoke-diagnostics
          path: |
            test-results/
            dist-gda-balancing/
          if-no-files-found: error

  balancing-required:
    name: gda-balancing required
    needs:
      - balancing-scope
      - balancing-inventory
      - balancing-tests
      - balancing-smoke
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # The one-minute unrelated-path target is a measured service level, not a
    # job timeout. Leave enough room for runner/startup jitter while the step
    # itself remains a constant-time shell assertion.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        if: ${{ needs.balancing-scope.outputs.required == 'true' }}
        uses: actions/checkout@v6

      - name: Set up gda-balancing environment
        if: ${{ needs.balancing-scope.outputs.required == 'true' }}
        uses: ./.github/actions/setup-python-env
        with:
          sync: member
          save-cache: false

      - name: Download every shard result
        if: ${{ needs.balancing-scope.outputs.required == 'true' }}
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: gda-balancing-*-diagnostics
          path: test-results
          merge-multiple: true

      - name: Prove aggregate execution closure
        if: ${{ needs.balancing-scope.outputs.required == 'true' }}
        run: |
          uv run --frozen --project libs/gda-balancing \
            python libs/gda-balancing/tools/ci.py aggregate-junit \
            --junit-dir test-results \
            --report test-results/aggregate.json

      - name: Upload aggregate duration and verdict report
        if: ${{ always() && needs.balancing-scope.outputs.required == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gda-balancing-aggregate
          path: test-results/aggregate.json
          if-no-files-found: error

      - name: Aggregate stable required result
        env:
          SCOPE_RESULT: ${{ needs.balancing-scope.result }}
          REQUIRED: ${{ needs.balancing-scope.outputs.required }}
          INVENTORY_RESULT: ${{ needs.balancing-inventory.result }}
          TEST_RESULT: ${{ needs.balancing-tests.result }}
          SMOKE_RESULT: ${{ needs.balancing-smoke.result }}
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "gda-balancing scope classification ended as: $SCOPE_RESULT" >&2
            exit 1
          fi
          case "$REQUIRED" in
            false)
              echo "All changed paths are explicitly unrelated to gda-balancing."
              exit 0
              ;;
            true) ;;
            *)
              echo "gda-balancing scope output is absent or invalid: $REQUIRED" >&2
              exit 1
              ;;
          esac
          for result in "$INVENTORY_RESULT" "$TEST_RESULT" "$SMOKE_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required gda-balancing dependency ended as: $result" >&2
              exit 1
            fi
          done

  coinstall-smoke:
    name: Both products co-install
    runs-on: ubuntu-latest

    # Replaces feedback the shared workspace lock used to give for free (ADR-0038).
    # While gda and gda-balancing resolved into one lock, uv proved on every
    # change that their dependency closures stay mutually satisfiable; two
    # independent locks each resolve alone and can silently drift into wheels
    # that cannot be installed side by side (a user who wants both, or a future
    # agent image carrying both, would hit it first). So the co-installability
    # claim becomes an explicit test: build both wheels, install them together
    # into one clean environment, and run a command from each.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # Neither project's venv is used here — the build backends run in
          # uv's own isolated build envs and the smoke install is a fresh venv.
          sync: none
          save-cache: false

      - name: Build both wheels
        run: |
          uv build --out-dir dist-coinstall
          uv build --project libs/gda-balancing --out-dir dist-coinstall

      - name: Install both into one clean environment and run each command
        run: |
          uv venv coinstall-venv
          uv pip install --python coinstall-venv/bin/python dist-coinstall/*.whl
          ./coinstall-venv/bin/gda --help
          ./coinstall-venv/bin/gda-balancing version

  godot-e2e:
    name: Godot e2e tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs['run-e2e']) }}

    steps:
      - name: Checkout repository
        # lfs: true so the engine/e2e asset loads and the export path see real
        # LFS-tracked bytes, not pointer files (gADR-0015). A no-op until wave-3.
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          # Engine-backed tiers are gda's and the example game's only; the
          # member ships no engine-facing code (ADR-0038).
          sync: root
          save-cache: false

      # install-godot also installs the matching export templates, so this job can
      # run the #301 template-gate behavioural proof (it exports a real template
      # binary). Every other e2e needs only the editor binary.
      - name: Install Godot
        uses: ./.github/actions/install-godot

      - name: Run Godot e2e tests
        # -rs surfaces skip reasons in the log (e.g. absent export templates, or no
        # DisplayServer for windowed capture), so a silently-skipped e2e is visible
        # rather than mistaken for a pass.
        run: uv run --frozen pytest -m e2e -rs

      # The example game's engine-backed tiers: the data round-trip + logic seam
      # (engine marker) and the live daemon loop (e2e). install-godot exported
      # GDA_GODOT, so these resolve the engine. -rs surfaces any skips.
      - name: Run Panda Adventure engine and e2e tests
        run: uv run --frozen pytest examples/platformer/panda-adventure/tests -m "engine or e2e" -rs

      # Portable export guard: `export get` validates the macOS preset is found and
      # parses (no templates or platform tooling needed), so it is safe on a Linux
      # runner. `export run --mode pack` works on macOS (verified) but a macOS preset
      # on a Linux runner is unverified here, so we keep `get`. The REAL .app export
      # is reproduced by scripts/export_macos.sh and smoke-tested on macOS (see PR).
      - name: Guard Panda Adventure export preset wiring
        run: uv run --frozen gda export get --preset macOS --project examples/platformer/panda-adventure --json
